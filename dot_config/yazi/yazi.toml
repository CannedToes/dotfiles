[manager]
show_hidden = false
sort_by = "natural"
sort_dir_first = true
linemode = "none"
show_symlink = true
scrolloff = 5

[preview]
tab_size = 2
max_width = 1200
max_height = 900

[opener]
edit = [{ run = 'nvim "$@"', block = true }]
open = [{ run = 'xdg-open "$1"', orphan = true }]

[open]
prepend_rules = [
  { name = "*.typ", use = "edit" },
  { name = "*.md", use = "edit" },
  { mime = "text/*", use = "edit" },
]
